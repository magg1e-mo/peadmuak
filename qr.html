<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ป้าย QR ติดกล่องหมวก</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/vendor/qrcode.js"></script>
<style>
  .sheet { background: #fff; border-radius: 24px; padding: 28px 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  .sheet .qr { width: 260px; height: 260px; }
  .sheet h1 { margin: 0; font-size: 34px; }
  .sheet h2 { margin: 0; font-size: 22px; }
  .divider { width: 100%; border-top: 2px dashed var(--line); }
  @media print {
    @page { size: A5; margin: 10mm; }
    body { background: #fff; }
    .no-print { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    .sheet { box-shadow: none; border: 2px solid #15171C; break-inside: avoid; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="no-print col" style="gap:10px">
    <a href="performer.html" class="small muted">กลับหน้าคนเล่น</a>
    <p class="small muted" style="margin:0">พิมพ์แผ่นนี้ (ขนาด A5) ติดหน้ากล่องหมวก แผ่นบนให้คนดูสแกนขอเพลง แผ่นล่างสแกนโอนทิปได้เลย</p>
    <button class="btn" type="button" onclick="window.print()">พิมพ์ป้าย</button>
  </div>

  <div class="sheet">
    <h1 class="display" id="name"></h1>
    <img id="qrReq" class="qr" alt="QR หน้าขอเพลง">
    <h2 class="display">สแกนขอเพลงได้เลย</h2>
    <div class="muted small" id="reqUrl" style="word-break:break-all"></div>
    <div class="divider"></div>
    <img id="qrPP" class="qr" alt="QR PromptPay">
    <h2 class="display">ทิปผ่าน PromptPay</h2>
    <div class="small"><span id="ppNum" style="font-weight:700"></span><br><span class="muted" id="ppName"></span></div>
  </div>
</main>
<script type="module">
  import { STAGE_NAME, PROMPTPAY_ID, PROMPTPAY_NAME } from './js/config.js';
  import { promptpayPayload } from './js/promptpay.js';
  import { qrDataUrl } from './js/qr.js';
  const url = new URL('./', location.href).href;   // หน้าขอเพลง (index.html) อยู่โฟลเดอร์เดียวกัน
  document.getElementById('name').textContent = STAGE_NAME;
  document.getElementById('qrReq').src = qrDataUrl(url, 720);
  document.getElementById('reqUrl').textContent = url.replace(/^https?:\/\//, '');
  document.getElementById('qrPP').src = qrDataUrl(promptpayPayload(PROMPTPAY_ID), 720);
  document.getElementById('ppNum').textContent = PROMPTPAY_ID.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
  document.getElementById('ppName').textContent = PROMPTPAY_NAME;
</script>
</body>
</html>
